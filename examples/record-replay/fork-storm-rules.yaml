# Fork Storm Detection Rules
#
# This configuration is tuned to detect the fork storms generated by
# generate_fork_storm.sh script with different intensity levels.
#
# Rule sensitivity:
# - low intensity:    10 forks/sec,  20 burst
# - medium intensity: 50 forks/sec, 100 burst
# - high intensity:  100 forks/sec, 200 burst
# - extreme intensity: 200 forks/sec, 500 burst

# Detect sustained fork rate (catches medium and high intensity)
- name: fork_storm_sustained
  detector: forks_per_sec
  threshold: 10         # Alert if > 10 forks/second
  duration: 2           # Over 2 second window
  severity: high
  cooldown: 30

# Detect fork bursts (catches initial burst phase)
- name: fork_storm_burst
  detector: fork_burst
  threshold: 30         # Alert if > 30 forks
  window_seconds: 5     # Within 5 second window
  severity: critical
  cooldown: 30

# Detect runaway parent process (catches runaway tree phase)
- name: runaway_parent_tree
  detector: runaway_tree
  threshold: 15         # Alert if single parent spawns > 15 children
  window_seconds: 10    # Within 10 second window
  severity: critical
  cooldown: 30

# Detect extreme fork storms (catches high and extreme intensity)
- name: fork_storm_extreme
  detector: forks_per_sec
  threshold: 50         # Alert if > 50 forks/second
  duration: 3           # Over 3 second window
  severity: critical
  cooldown: 30

# Detect short-lived process floods (catches all phases)
- name: short_lived_flood
  detector: short_job_flood
  threshold: 40               # Alert if > 40 short processes
  window_seconds: 10          # Within 10 seconds
  max_exec_duration_ms: 200   # That live < 200ms
  severity: high
  cooldown: 30

# Detect high exec rate with quick completions
- name: rapid_exec_completions
  detector: exec_rate
  regex: ".*"                 # Match all commands
  rate_per_min: 60            # > 60 execs per minute
  median_lifetime: 1          # With median lifetime < 1 second
  severity: medium
  cooldown: 30
