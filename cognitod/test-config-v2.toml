# Test configuration for Record/Replay V2 functionality

[api]
enabled = true
host = "127.0.0.1"
port = 3000
# token = "test-token-123"

[recording]
enabled = true
file_path = "/tmp/linnix_test_recording_v2.jsonl"
v2_format = true
snapshots_enabled = true
snapshot_interval_ms = 5000  # 5 seconds
process_snapshot_limit = 50
process_cpu_threshold = 1.0
compress_output = false
activity_threshold = 0  # Set to 0 to always update RSS (bypasses the 20 events/sec issue)

[circuit_breaker]
enabled = false  # Disabled for testing to avoid killing processes

[rules]
enabled = true

[llm]
enabled = false  # Disabled for local testing

[notifications]
enabled = false
