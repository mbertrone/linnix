apiVersion: v1
kind: Pod
metadata:
  name: cognitod
  namespace: datadog-agent
  labels:
    app: cognitod
  annotations:
    ad.datadoghq.com/main.logs: '[{"service": "cognitod", "source": "rust"}]'
spec:
  # serviceAccountName: cognitod-sa  # Commented out - not using RBAC
  hostPID: true
  hostNetwork: false
  nodeSelector:
    kubernetes.io/arch: amd64
#    kubernetes.io/hostname: ip-xx-xx-xx-xxx.ec2.internal
  tolerations:
    - operator: Exists
      effect: NoSchedule
  containers:
    - name: cognitod
      image: registry.ddbuild.io/cognitod:v0.2.3
      imagePullPolicy: Always
      securityContext:
        privileged: true
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: RUST_LOG
          value: "info"
#          value: "off,cognitod::alerts=info"
#        - name: RUST_LOG_STYLE
#          value: "never"
#        - name: RUST_LOG_FORMAT
#          value: "json"
      volumeMounts:
        - name: config
          mountPath: /etc/linnix
          readOnly: true
        - name: sys-btf
          mountPath: /sys/kernel/btf/vmlinux
          readOnly: true
        - name: debugfs
          mountPath: /sys/kernel/debug
          readOnly: true
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: proc
          mountPath: /proc
          readOnly: true
      resources:
        limits:
          memory: 512Mi
          cpu: 500m
        requests:
          memory: 256Mi
          cpu: 200m
      ports:
        - containerPort: 3000
          name: http
          protocol: TCP
  volumes:
    - name: config
      configMap:
        name: cognitod-config
    - name: sys-btf
      hostPath:
        path: /sys/kernel/btf/vmlinux
        type: File
    - name: debugfs
      hostPath:
        path: /sys/kernel/debug
        type: Directory
    - name: sys
      hostPath:
        path: /sys
    - name: proc
      hostPath:
        path: /proc
