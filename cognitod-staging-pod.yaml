apiVersion: v1
kind: ConfigMap
metadata:
  name: cognitod-config
  namespace: datadog-agent
  labels:
    app: cognitod
data:
  linnix.toml: |
    [api]
    listen_addr = "0.0.0.0:3000"

    [runtime]
    offline = false
    cpu_target_pct = 25
    rss_cap_mb = 512

    [circuit_breaker]
    enabled = true
    mode = "monitor"
    cpu_usage_threshold = 90.0
    cpu_psi_threshold = 40.0
    grace_period_secs = 15
    require_human_approval = true

    [reasoner]
    enabled = false

    [prometheus]
    enabled = true
    
    # Staging test configuration
    [logging]
    level = "info"
    format = "json"
  rules.yaml: |
    # Demo rules optimized for scenario detection
    # Using actual supported detectors

    - name: fork_storm_demo
      detector: forks_per_sec
      threshold: 10  # forks per second
      duration: 2    # seconds
      severity: high
      cooldown: 30

    - name: fork_burst_demo
      detector: fork_burst
      threshold: 30  # total forks
      window_seconds: 5
      severity: medium
      cooldown: 30

    - name: memory_leak_demo
      detector: subtree_rss_mb
      threshold: 50   # MB total RSS (lower to ensure quick detection)
      duration: 2     # seconds
      severity: high
      cooldown: 30

    - name: cpu_spike_demo
      detector: subtree_cpu_pct
      threshold: 50  # percent CPU
      duration: 5    # seconds
      severity: medium
      cooldown: 30
---
apiVersion: v1
kind: Pod
metadata:
  name: cognitod
  namespace: datadog-agent
  labels:
    app: cognitod
spec:
  # serviceAccountName: cognitod-sa  # Commented out - not using RBAC
  hostPID: true
  hostNetwork: false
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: ip-10-128-101-68.ec2.internal
  tolerations:
    - operator: Exists
      effect: NoSchedule
  containers:
    - name: cognitod
      image: registry.ddbuild.io/cognitod:v0.2.0
      imagePullPolicy: Always
      securityContext:
        capabilities:
          add:
            - BPF
            - PERFMON
            - SYS_RESOURCE
            - SYS_ADMIN
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: RUST_LOG
          value: "info"
      volumeMounts:
        - name: config
          mountPath: /etc/linnix
          readOnly: true
        - name: sys-btf
          mountPath: /sys/kernel/btf/vmlinux
          readOnly: true
        - name: debugfs
          mountPath: /sys/kernel/debug
          readOnly: true
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: proc
          mountPath: /proc
          readOnly: true
      resources:
        limits:
          memory: 512Mi
          cpu: 500m
        requests:
          memory: 256Mi
          cpu: 200m
      ports:
        - containerPort: 3000
          name: http
          protocol: TCP
  volumes:
    - name: config
      configMap:
        name: cognitod-config
    - name: sys-btf
      hostPath:
        path: /sys/kernel/btf/vmlinux
        type: File
    - name: debugfs
      hostPath:
        path: /sys/kernel/debug
        type: Directory
    - name: sys
      hostPath:
        path: /sys
    - name: proc
      hostPath:
        path: /proc