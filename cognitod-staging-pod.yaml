apiVersion: v1
kind: ConfigMap
metadata:
  name: cognitod-config
  namespace: datadog-agent
  labels:
    app: cognitod
data:
  linnix.toml: |
    [api]
    listen_addr = "0.0.0.0:3000"

    [runtime]
    offline = false
    cpu_target_pct = 25
    rss_cap_mb = 512

    [circuit_breaker]
    enabled = true
    mode = "monitor"
    cpu_usage_threshold = 50.0
    cpu_psi_threshold = 20.0
    grace_period_secs = 5
    require_human_approval = true

    [reasoner]
    enabled = false

    [prometheus]
    enabled = true

    # Lock contention monitoring (Linux 5.19+)
    [lock_contention]
    enabled = true
    log_summary = true
    log_interval_secs = 60

    # Staging test configuration
    [logging]
    level = "info"
    format = "json"
  rules.yaml: |
    # Production rules for high-activity staging nodes
    # Baseline observed: ~70 forks/sec, 350 forks/5s
    
    # Rule 1: Sustained high fork rate (actual fork bomb pattern)
    - name: fork_storm_sustained
      detector: forks_per_sec
      threshold: 200            # ~3x your baseline (70 forks/sec)
      duration: 10              # Must sustain for 10 seconds (not brief spike)
      severity: high
      cooldown: 120
    
    # Rule 2: Extreme fork burst (emergency detection)
    - name: fork_burst_extreme
      detector: fork_burst
      threshold: 1000           # ~3x your 5-sec baseline (346)
      window_seconds: 5
      severity: critical
      cooldown: 60
    
    # Rule 3: Runaway single process (actual fork bomb signature)
    - name: runaway_process_tree
      detector: runaway_tree
      threshold: 100            # Single parent spawns 100+ children
      window_seconds: 10        # Within 10 seconds
      severity: critical
      cooldown: 90
    
    # Rule 4: Short-lived process flood (crash loop detection)
    - name: crash_loop_detection
      detector: short_job_flood
      threshold: 100            # 100 processes
      window_seconds: 30        # Within 30 seconds
      max_exec_duration_ms: 500 # Living less than 500ms
      severity: high
      cooldown: 120

    # Rule 5: Lock contention (kernel lock wait time)
    # Alerts when total lock wait time exceeds threshold in a window
    # Uses eBPF tracepoints (lock:contention_begin/end) - requires Linux 5.19+
    - name: high_lock_contention
      detector: lock_contention_wait
      threshold_us: 500000      # 500ms total wait time in window
      window_seconds: 10        # Within 10 seconds
      severity: high
      cooldown: 120


